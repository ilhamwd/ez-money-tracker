version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ez-money-tracker-db
    env_file:
      - ../.env
    expose:
      - "5432"
    volumes:
      - ./.docker/db:/var/lib/postgresql/data
    networks:
      - ez-money-network
    restart: unless-stopped

networks:
  ez-money-network:
    name: ez-money-network
    driver: bridge
    internal: true
